<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif">
  <title>d3v-keyguard: secrets for AI agents, never in the prompt</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFD"/>
      <stop offset="1" stop-color="#EEF2F8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1E293B" flood-opacity="0.13"/>
    </filter>
    <filter id="shadowSoft" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1E293B" flood-opacity="0.08"/>
    </filter>
    <marker id="aReq" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1.5,1.5 L8.5,5 L1.5,8.5 Z" fill="#55657E" stroke="#55657E" stroke-width="1.4" stroke-linejoin="round"/>
    </marker>
    <marker id="aResp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1.5,1.5 L8.5,5 L1.5,8.5 Z" fill="#8A97AB" stroke="#8A97AB" stroke-width="1.4" stroke-linejoin="round"/>
    </marker>
    <marker id="aStore" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1.5,1.5 L8.5,5 L1.5,8.5 Z" fill="#C98A2E" stroke="#C98A2E" stroke-width="1.4" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Title -->
  <text x="60" y="64" font-size="32" font-weight="700" fill="#1E293B" letter-spacing="-0.3">d3v-keyguard <tspan fill="#94A3B8" font-weight="400">—</tspan> secrets for AI agents, never in the prompt</text>
  <text x="60" y="96" font-size="17" fill="#5B6B82">LLM sees handles  ·  tools get values  ·  humans hold the PIN</text>

  <!-- Legend -->
  <g font-size="13" fill="#5B6B82">
    <line x1="1188" y1="62" x2="1222" y2="62" stroke="#55657E" stroke-width="2" marker-end="url(#aReq)"/>
    <text x="1232" y="66.5">request</text>
    <line x1="1300" y1="62" x2="1334" y2="62" stroke="#8A97AB" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#aResp)"/>
    <text x="1344" y="66.5">response</text>
    <line x1="1420" y1="62" x2="1454" y2="62" stroke="#C98A2E" stroke-width="2" marker-end="url(#aStore)"/>
    <text x="1464" y="66.5">store</text>
  </g>

  <!-- ===== Keyguard zone container ===== -->
  <rect x="400" y="310" width="530" height="350" rx="18" fill="#EFF9F7" stroke="#BFE3DC" stroke-width="1.5"/>
  <text x="424" y="342" font-size="15" font-weight="700" fill="#136B60" letter-spacing="0.4">d3v-keyguard <tspan font-weight="400" fill="#3F7F76">callbacks</tspan></text>
  <text x="665" y="373" font-size="12" font-family="Consolas, 'SF Mono', Menlo, monospace" fill="#3F7F76" text-anchor="middle">before_tool</text>
  <text x="540" y="645" font-size="12" font-family="Consolas, 'SF Mono', Menlo, monospace" fill="#3F7F76" text-anchor="middle">before_model</text>
  <text x="795" y="645" font-size="12" font-family="Consolas, 'SF Mono', Menlo, monospace" fill="#3F7F76" text-anchor="middle">after_tool</text>

  <!-- ===== Arrows (drawn under blocks) ===== -->
  <!-- 1 store: user -> vault (overhead) -->
  <path d="M320,168 L320,147 Q320,135 332,135 L1048,135 Q1060,135 1060,147 L1060,166" fill="none" stroke="#C98A2E" stroke-width="2" marker-end="url(#aStore)"/>
  <!-- request path -->
  <line x1="360" y1="430" x2="428" y2="430" stroke="#55657E" stroke-width="2" marker-end="url(#aReq)"/>
  <line x1="650" y1="430" x2="688" y2="430" stroke="#55657E" stroke-width="2" marker-end="url(#aReq)"/>
  <line x1="795" y1="385" x2="795" y2="262" stroke="#55657E" stroke-width="2" marker-end="url(#aReq)"/>
  <line x1="935" y1="215" x2="988" y2="215" stroke="#55657E" stroke-width="2" marker-end="url(#aReq)"/>
  <line x1="1105" y1="260" x2="1105" y2="383" stroke="#55657E" stroke-width="2" marker-end="url(#aReq)"/>
  <line x1="1220" y1="430" x2="1268" y2="430" stroke="#55657E" stroke-width="2" marker-end="url(#aReq)"/>
  <!-- pepper link -->
  <line x1="1220" y1="215" x2="1270" y2="215" stroke="#7DBF89" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/>
  <!-- response path -->
  <path d="M1405,475 L1405,563 Q1405,575 1393,575 L902,575" fill="none" stroke="#8A97AB" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#aResp)"/>
  <line x1="690" y1="575" x2="652" y2="575" stroke="#8A97AB" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#aResp)"/>
  <path d="M430,575 L222,575 Q210,575 210,563 L210,497" fill="none" stroke="#8A97AB" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#aResp)"/>

  <!-- arrow labels -->
  <g font-size="12.5">
    <rect x="452" y="123" width="216" height="24" rx="12" fill="#FFF7EA" stroke="#F1CF95"/>
    <text x="560" y="139.5" text-anchor="middle" fill="#7A4D12">saved as pending until approved</text>
    <rect x="1036" y="563" width="196" height="24" rx="12" fill="#FFFFFF" stroke="#D5DCE6"/>
    <text x="1134" y="579.5" text-anchor="middle" fill="#55657E">raw response, may hold secrets</text>
    <rect x="232" y="563" width="150" height="24" rx="12" fill="#FFFFFF" stroke="#C9CFF3"/>
    <text x="307" y="579.5" text-anchor="middle" fill="#3B4396">handles · [REDACTED]</text>
  </g>

  <!-- ===== Blocks ===== -->
  <!-- 1 Store secret (amber) -->
  <g filter="url(#shadow)"><rect x="60" y="170" width="300" height="90" rx="14" fill="#FFF5E6" stroke="#F1C987" stroke-width="1.5"/></g>
  <text x="84" y="210" font-size="19" font-weight="600" fill="#5C3A0E">Store secret</text>
  <text x="84" y="236" font-size="14" fill="#7A5524">Developer · secure dialog or CLI</text>

  <!-- 4 Human enters PIN (amber) -->
  <g filter="url(#shadow)"><rect x="655" y="170" width="280" height="90" rx="14" fill="#FFF5E6" stroke="#F1C987" stroke-width="1.5"/></g>
  <text x="679" y="210" font-size="19" font-weight="600" fill="#5C3A0E">Human enters PIN</text>
  <text x="679" y="236" font-size="14" fill="#7A5524">Secure OS dialog · never in chat</text>

  <!-- 5 Vault (green) -->
  <g filter="url(#shadow)"><rect x="990" y="170" width="230" height="90" rx="14" fill="#EAF6EC" stroke="#9AD1A4" stroke-width="1.5"/></g>
  <text x="1014" y="210" font-size="19" font-weight="600" fill="#1E4F27">Vault decrypt</text>
  <text x="1014" y="236" font-size="14" fill="#3D6B45">Argon2id(PIN + pepper)</text>

  <!-- Pepper / OS keyring (green, secondary) -->
  <g filter="url(#shadowSoft)"><rect x="1270" y="170" width="270" height="90" rx="14" fill="#F3FAF4" stroke="#B9DFC0" stroke-width="1.5"/></g>
  <text x="1294" y="210" font-size="17" font-weight="600" fill="#1E4F27">Pepper in OS keyring</text>
  <text x="1294" y="236" font-size="14" fill="#3D6B45">Windows Credential Manager</text>

  <!-- 2 LLM Agent (indigo) -->
  <g filter="url(#shadow)"><rect x="60" y="365" width="300" height="130" rx="14" fill="#EEF0FE" stroke="#B3BBF2" stroke-width="1.5"/></g>
  <text x="84" y="405" font-size="19" font-weight="600" fill="#262C6E">LLM Agent</text>
  <text x="84" y="430" font-size="14" fill="#4A5296">Gemini / ADK · sees handles only</text>
  <rect x="84" y="446" width="252" height="28" rx="8" fill="#FFFFFF" stroke="#CDD2F5"/>
  <text x="210" y="465" font-size="12" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, monospace" fill="#3B4396">call_api(auth="keyguard://prod_api")</text>

  <!-- 3 Policy check (teal) -->
  <g filter="url(#shadow)"><rect x="430" y="385" width="220" height="90" rx="14" fill="#E2F5F1" stroke="#8ACFC3" stroke-width="1.5"/></g>
  <text x="454" y="425" font-size="19" font-weight="600" fill="#0F4C44">Policy check</text>
  <text x="454" y="451" font-size="14" fill="#2E6B62">deny by default</text>

  <!-- Unlock? (teal) -->
  <g filter="url(#shadow)"><rect x="690" y="385" width="210" height="90" rx="14" fill="#E2F5F1" stroke="#8ACFC3" stroke-width="1.5"/></g>
  <text x="714" y="425" font-size="19" font-weight="600" fill="#0F4C44">Unlock?</text>
  <text x="714" y="451" font-size="14" fill="#2E6B62">ask human if locked</text>

  <!-- 6 Inject (teal) -->
  <g filter="url(#shadow)"><rect x="990" y="385" width="230" height="90" rx="14" fill="#E2F5F1" stroke="#8ACFC3" stroke-width="1.5"/></g>
  <text x="1014" y="425" font-size="19" font-weight="600" fill="#0F4C44">Inject real value</text>
  <text x="1014" y="451" font-size="14" fill="#2E6B62">into the tool call only</text>

  <!-- External API (neutral) -->
  <g filter="url(#shadow)"><rect x="1270" y="385" width="270" height="90" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/></g>
  <text x="1294" y="425" font-size="19" font-weight="600" fill="#1E293B">External API / CLI</text>
  <text x="1294" y="451" font-size="14" fill="#55657E">receives the real secret</text>

  <!-- Final safety net (teal) -->
  <g filter="url(#shadow)"><rect x="430" y="530" width="220" height="90" rx="14" fill="#E2F5F1" stroke="#8ACFC3" stroke-width="1.5"/></g>
  <text x="454" y="570" font-size="19" font-weight="600" fill="#0F4C44">Final safety net</text>
  <text x="454" y="596" font-size="14" fill="#2E6B62">scrub before the model</text>

  <!-- 7 Redact / capture (teal) -->
  <g filter="url(#shadow)"><rect x="690" y="530" width="210" height="90" rx="14" fill="#E2F5F1" stroke="#8ACFC3" stroke-width="1.5"/></g>
  <text x="714" y="570" font-size="19" font-weight="600" fill="#0F4C44">Redact / capture</text>
  <text x="714" y="596" font-size="14" fill="#2E6B62">values → handles</text>

  <!-- ===== Step badges ===== -->
  <g font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <circle cx="84" cy="170" r="13" fill="#A8661A" stroke="#FFFFFF" stroke-width="2.5"/><text x="84" y="174.5">1</text>
    <circle cx="84" cy="365" r="13" fill="#4F5BD5" stroke="#FFFFFF" stroke-width="2.5"/><text x="84" y="369.5">2</text>
    <circle cx="454" cy="385" r="13" fill="#127A6C" stroke="#FFFFFF" stroke-width="2.5"/><text x="454" y="389.5">3</text>
    <circle cx="679" cy="170" r="13" fill="#A8661A" stroke="#FFFFFF" stroke-width="2.5"/><text x="679" y="174.5">4</text>
    <circle cx="1014" cy="170" r="13" fill="#2F7F40" stroke="#FFFFFF" stroke-width="2.5"/><text x="1014" y="174.5">5</text>
    <circle cx="1014" cy="385" r="13" fill="#127A6C" stroke="#FFFFFF" stroke-width="2.5"/><text x="1014" y="389.5">6</text>
    <circle cx="714" cy="530" r="13" fill="#127A6C" stroke="#FFFFFF" stroke-width="2.5"/><text x="714" y="534.5">7</text>
  </g>

  <!-- ===== Threat callouts (rose) ===== -->
  <g font-size="15">
    <g filter="url(#shadowSoft)"><rect x="60" y="698" width="466" height="54" rx="14" fill="#FFF1F3" stroke="#F2BBC4" stroke-width="1.5"/></g>
    <g transform="translate(50,0)"><circle cx="90" cy="725" r="10" fill="#C2414F"/>
    <path d="M86,721 L94,729 M94,721 L86,729" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <text x="112" y="730" fill="#7A2333"><tspan font-weight="600">Prompt-injected tool</tspan>  →  blocked by policy</text></g>

    <g filter="url(#shadowSoft)"><rect x="567" y="698" width="466" height="54" rx="14" fill="#FFF1F3" stroke="#F2BBC4" stroke-width="1.5"/></g>
    <g transform="translate(58,0)"><circle cx="597" cy="725" r="10" fill="#C2414F"/>
    <path d="M593,721 L601,729 M601,721 L593,729" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <text x="619" y="730" fill="#7A2333"><tspan font-weight="600">Stolen vault file</tspan>  →  ciphertext only</text></g>

    <g filter="url(#shadowSoft)"><rect x="1074" y="698" width="466" height="54" rx="14" fill="#FFF1F3" stroke="#F2BBC4" stroke-width="1.5"/></g>
    <g transform="translate(14,0)"><circle cx="1104" cy="725" r="10" fill="#C2414F"/>
    <path d="M1100,721 L1108,729 M1108,721 L1100,729" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <text x="1126" y="730" fill="#7A2333"><tspan font-weight="600">Planted entry</tspan>  →  pending until a human approves</text></g>
  </g>

  <!-- ===== Shell harness lane ===== -->
  <rect x="60" y="780" width="1480" height="74" rx="14" fill="#F2F4FA" stroke="#D6DCEA" stroke-width="1.5"/>
  <text x="84" y="812" font-size="16" font-weight="600" fill="#262C6E">Shell harnesses</text>
  <text x="84" y="835" font-size="13" fill="#4A5296">Claude Code · Codex · Gemini CLI</text>
  <rect x="380" y="801" width="440" height="32" rx="8" fill="#FFFFFF" stroke="#CDD2F5"/>
  <text x="600" y="822" font-size="13" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, monospace" fill="#3B4396">d3v-keyguard exec --env TOKEN=keyguard://gh -- gh …</text>
  <line x1="836" y1="817" x2="886" y2="817" stroke="#55657E" stroke-width="2" marker-end="url(#aReq)"/>
  <rect x="896" y="801" width="170" height="32" rx="16" fill="#E2F5F1" stroke="#8ACFC3"/>
  <text x="981" y="822" font-size="14" font-weight="600" text-anchor="middle" fill="#0F4C44">output redacted</text>
  <text x="1516" y="822" font-size="13" text-anchor="end" fill="#5B6B82">same policy · same vault · same PIN</text>
</svg>
