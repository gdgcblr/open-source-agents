[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "d3v-keyguard"
version = "0.1.0"
description = "PIN-protected local secret vault for LLM agents (Google ADK, CLI, Agent Skill)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["cryptography>=44", "keyring>=25"]

[project.optional-dependencies]
adk = ["google-adk>=2.13"]
dev = ["pytest>=8"]

[project.scripts]
d3v-keyguard = "d3v_keyguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
