{% extends "base.html" %}
{% block title %}Sign in · Personal lab tracker{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Sign in</h1>
  <p class="lede">The account stays on this machine. Nothing is emailed.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required value="{{ email or '' }}">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
  <p class="switch">New here? <a href="/register">Create an account</a></p>
</section>
{% endblock %}
