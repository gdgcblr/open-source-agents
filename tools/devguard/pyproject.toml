[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devguard"
version = "0.1.0"
description = "A lightweight, local-first CLI that enforces command permission policies and generates AI-assisted commit messages."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "DevGuard Contributors" }
]
keywords = ["developer-tools", "cli", "permissions", "security", "git", "ai", "gemini"]
dependencies = [
    "click>=8.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ai = [
    "google-genai>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
devguard = "devguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

