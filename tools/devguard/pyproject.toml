[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devguard"
version = "0.1.0"
description = "A lightweight, local-first CLI that enforces command permission policies and generates AI-assisted commit messages."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "DevGuard Contributors" }
]
keywords = ["developer-tools", "cli", "permissions", "security", "git", "ai", "gemini", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ai = [
    "google-genai>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]
all = [
    "google-genai>=1.0.0",
]
# Note: Ollama support uses Python stdlib only — no extra packages needed.
# Simply run 'ollama serve' locally and set DEVGUARD_AI_PROVIDER=ollama.

[project.urls]
"Homepage" = "https://github.com/google/open-source-agents/tree/main/tools/devguard"
"Bug Tracker" = "https://github.com/google/open-source-agents/issues"
"Source Code" = "https://github.com/google/open-source-agents/tree/main/tools/devguard"

[project.scripts]
devguard = "devguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
devguard = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

