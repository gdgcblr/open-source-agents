# DevGuard Policy Configuration Example
# -----------------------------------------------------------------------------
# Optional preset: 'conservative', 'development', or 'custom'
# When set, preset rules form the baseline, and any rules defined below override or extend it.
# preset: development

# Default decision when no rule matches: 'allow', 'ask', or 'deny' (default: deny)
default_policy: ask

# Commands allowed to run without prompting
allow:
  - ["git", "status"]
  - ["git", "diff"]
  - ["git", "log"]
  - ["python3", "-m", "pytest"]
  - ["echo"]

# Commands requiring explicit user confirmation before running
ask:
  - ["git", "commit"]
  - ["git", "push"]

# Commands that are unconditionally refused
# Explicit deny rules are authoritative and cannot be overridden by allow rules.
deny:
  - ["git", "reset", "--hard"]
  - ["git", "clean", "-fdx"]
