[project]
name = "rce-sentinel"
version = "0.1.0"
description = "Cost-aware git-hook scanner and zero-day intel agent for Remote Code Execution risk"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "packaging>=23.0",
  "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
rce-sentinel = "rce_sentinel.cli:main"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rce_sentinel"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "rce_sentinel/_config"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
