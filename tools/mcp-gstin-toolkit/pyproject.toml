[project]
name = "mcp-gstin-toolkit"
version = "0.1.0"
description = "MCP server and CLI for validating Indian GSTINs and auditing GST CSV feeds"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["mcp>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gstin-mcp = "gstin_toolkit.server:main"
gstin-toolkit = "gstin_toolkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gstin_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
