[project]
name = "aran"
version = "0.1.0"
description = "Aran (அரண்): a local-first privacy gateway that hides Indian PII from documents before they reach a cloud LLM."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "mcp>=2.0,<3",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pypdf>=5.0",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.scripts]
aran = "aran.cli:main"

[dependency-groups]
dev = [
    "fpdf2>=2.8",
    "pillow>=10.4",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aran"]

[tool.pytest.ini_options]
testpaths = ["tests"]
