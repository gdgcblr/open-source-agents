<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="RentRakshak">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="900" height="200" rx="16" fill="url(#bg)"/>
  <text x="450" y="78" text-anchor="middle" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="42" font-weight="800">RentRakshak</text>
  <text x="450" y="118" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="18">Rent smarter · Stay safer · Help the next tenant</text>
  <rect x="250" y="145" width="400" height="6" rx="3" fill="#334155"/>
  <rect x="250" y="145" width="0" height="6" rx="3" fill="url(#accent)">
    <animate attributeName="width" values="0;400;320;400" dur="4s" repeatCount="indefinite"/>
  </rect>
  <circle cx="120" cy="100" r="4" fill="#38bdf8" opacity="0.8">
    <animate attributeName="cy" values="95;105;95" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="780" cy="90" r="6" fill="#3b82f6" opacity="0.6">
    <animate attributeName="cy" values="85;95;85" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>
