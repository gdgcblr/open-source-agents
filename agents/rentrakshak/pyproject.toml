[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rentrakshak"
version = "0.1.0"
description = "Bengaluru rental safety agent and anonymous tenant community"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-adk>=1.39.0",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "streamlit>=1.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ollama = ["google-adk[extensions]>=1.39.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["rentrakshak*"]
