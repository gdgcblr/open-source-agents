<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070E"/>
      <stop offset="50%" stop-color="#0A0F24"/>
      <stop offset="100%" stop-color="#030509"/>
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#7000FF"/>
    </linearGradient>

    <linearGradient id="btn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#0072FF"/>
      <stop offset="100%" stop-color="#7000FF"/>
    </linearGradient>

    <radialGradient id="play-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="25" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#00F0FF" flood-opacity="0.2"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, sans-serif; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.35">
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <!-- Central Editor Window (3D Floating Effect) -->
  <g filter="url(#shadow)" transform="translate(100, 70)">
    <!-- Window Border & Body -->
    <rect width="1000" height="490" rx="16" fill="#0D1326" stroke="#2A3859" stroke-width="1.5"/>

    <!-- Window Header -->
    <rect width="1000" height="48" rx="16" fill="#141B33"/>
    <rect y="32" width="1000" height="16" fill="#141B33"/>
    <line x1="0" y1="48" x2="1000" y2="48" stroke="#222E4A" stroke-width="1"/>

    <!-- Mac Traffic Lights -->
    <circle cx="28" cy="24" r="6" fill="#FF5F56"/>
    <circle cx="48" cy="24" r="6" fill="#FFBD2E"/>
    <circle cx="68" cy="24" r="6" fill="#27C93F"/>

    <!-- Header Title -->
    <text x="500" y="29" fill="#94A3B8" font-size="13" class="sans" text-anchor="middle" font-weight="500">
      🎬 IntentGuard — Interactive Product Advert (Apple Keynote Style)
    </text>

    <!-- Side Navigation Mock -->
    <rect x="0" y="48" width="220" height="442" fill="#0B0F1F"/>
    <line x1="220" y1="48" x2="220" y2="490" stroke="#1E293B" stroke-width="1"/>

    <!-- Explorer items -->
    <text x="24" y="85" fill="#64748B" font-size="11" class="mono" font-weight="700">DEMO TIMELINE</text>
    
    <rect x="16" y="105" width="188" height="30" rx="6" fill="#1E293B" opacity="0.6"/>
    <circle cx="32" cy="120" r="4" fill="#00F0FF"/>
    <text x="46" y="124" fill="#E2E8F0" font-size="12" class="sans">1. The AI Blindspot</text>

    <text x="46" y="160" fill="#94A3B8" font-size="12" class="sans">2. Injection Shield</text>
    <text x="46" y="196" fill="#94A3B8" font-size="12" class="sans">3. AST Laser Scan</text>
    <text x="46" y="232" fill="#94A3B8" font-size="12" class="sans">4. Verdict Scorecard</text>
    <text x="46" y="268" fill="#94A3B8" font-size="12" class="sans">5. FastMCP Editor Tool</text>

    <!-- Main Content Area -->
    <g transform="translate(250, 75)">
      <!-- Code preview lines -->
      <text x="0" y="25" fill="#EC4899" font-size="14" class="mono">@@ -14,6 +14,18 @@ async def exchange_auth_code(request):</text>
      <text x="0" y="52" fill="#94A3B8" font-size="13" class="mono">     code = request.query_params.get("code")</text>
      <text x="0" y="76" fill="#10B981" font-size="13" class="mono">+    # Intent: Exchange authorization code for JWT</text>
      <text x="0" y="100" fill="#EF4444" font-size="13" class="mono">+    # SCOPE CREEP DETECTED by IntentGuard:</text>
      <text x="0" y="124" fill="#EF4444" font-size="13" class="mono">+    await db.users.update_many({}, {"$set": {"is_admin": True}})</text>
      
      <!-- Cyan Scanline Beam -->
      <rect x="-20" y="145" width="720" height="2" fill="#00F0FF" opacity="0.9"/>
      <rect x="-20" y="135" width="720" height="22" fill="url(#play-glow)" opacity="0.3"/>

      <!-- Shield Alert Badge -->
      <rect x="0" y="180" width="460" height="70" rx="10" fill="#161226" stroke="#EF4444" stroke-width="1.2"/>
      <circle cx="28" cy="215" r="14" fill="#EF4444" opacity="0.2"/>
      <text x="28" y="220" fill="#EF4444" font-size="15" text-anchor="middle" font-weight="bold">!</text>
      <text x="56" y="206" fill="#FCA5A5" font-size="14" class="sans" font-weight="700">SCOPE CREEP &amp; SECURITY ANOMALY</text>
      <text x="56" y="228" fill="#CBD5E1" font-size="12" class="mono">Unprompted permission escalation in auth route</text>
    </g>

    <!-- Giant Play Button Overlay in Center -->
    <circle cx="610" cy="290" r="70" fill="url(#play-glow)"/>
    <circle cx="610" cy="290" r="46" fill="url(#btn-grad)" filter="url(#shadow)"/>
    <polygon points="602,274 626,290 602,306" fill="#FFFFFF"/>

    <!-- Bottom Action Pill Bar -->
    <g transform="translate(370, 395)">
      <rect width="480" height="52" rx="26" fill="#111827" stroke="url(#cyan-glow)" stroke-width="2"/>
      <text x="240" y="32" fill="#FFFFFF" font-size="16" class="sans" font-weight="600" text-anchor="middle">
        ▶ Open demo.html in Browser to Watch (0:45)
      </text>
    </g>
  </g>

  <!-- Bottom Feature Tags -->
  <g transform="translate(180, 585)">
    <text x="0" y="0" fill="#64748B" font-size="13" class="sans">✨ 3D Camera Transitions</text>
    <text x="220" y="0" fill="#64748B" font-size="13" class="sans">⚡ FastMCP in Cursor &amp; Antigravity</text>
    <text x="510" y="0" fill="#64748B" font-size="13" class="sans">🛡️ Zero Prompt Injection Vulnerability</text>
  </g>
</svg>
