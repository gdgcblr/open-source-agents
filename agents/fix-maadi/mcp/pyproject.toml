[project]
name = "fix-maadi-mcp"
version = "0.1.0"
description = "Safe MCP bridge for the local Fix Maadi civic routing agent"
requires-python = ">=3.9"
dependencies = ["mcp>=1.0.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]

[project.scripts]
fix-maadi-mcp = "server:main"
