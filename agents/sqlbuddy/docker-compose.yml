services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      SQLBUDDY_DATABASE_PATH: /app/data/sqlbuddy.db
      SQLBUDDY_FRONTEND_ORIGIN: http://localhost:5173
    volumes:
      - sqlbuddy-history:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_PROXY: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:5173"

volumes:
  sqlbuddy-history:
