[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-stress-lab"
version = "0.2.0"
description = "Stress-test tool-using AI agents with simulated users, injected tool faults, policy guardrails and replayable traces."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
dependencies = [
  "fastmcp>=4.1,<5",
  "mcp>=2.3,<3",
  "pydantic>=2.10,<3",
  "PyYAML>=6",
  "python-dotenv>=1",
  "litellm>=1.100,<2",
]

[project.optional-dependencies]
adk = ["google-adk>=2.13,<3"]
dev = ["pytest>=8", "pytest-asyncio>=1"]

[project.scripts]
murphy = "murphy.cli:main"

[tool.setuptools.packages.find]
include = ["murphy*"]

[tool.setuptools.package-data]
murphy = ["report/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
