<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="510" viewBox="0 0 1280 510" role="img" aria-labelledby="title desc">
  <title id="title">RepoLens scan and reporting pipeline</title>
  <desc id="desc">Six stages from a public GitHub repository URL through scanners, secret redaction, optional Gemini assistance, and the dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101815"/><stop offset="1" stop-color="#0b100f"/></linearGradient>
    <linearGradient id="mint" x1="0" x2="1"><stop stop-color="#b7f36b"/><stop offset="1" stop-color="#8fda78"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#6f8b67"/></marker>
  </defs>
  <rect width="1280" height="510" rx="22" fill="url(#bg)"/><rect x="1" y="1" width="1278" height="508" rx="21" fill="none" stroke="#344238"/>
  <text x="42" y="48" fill="#b7f36b" font-family="monospace" font-size="11" letter-spacing="2">THE REPOLENS PIPELINE</text>
  <text x="42" y="81" fill="#e8eee9" font-family="Arial,sans-serif" font-weight="700" font-size="26">From repository URL to an explainable audit</text>
  <text x="42" y="106" fill="#91a39a" font-family="Arial,sans-serif" font-size="13">Evidence is collected by scanners. Gemini adds optional context after normalization and redaction.</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(34 157)">
      <rect width="178" height="228" rx="13" fill="#111816" stroke="#405338"/><circle cx="28" cy="30" r="15" fill="#1c291e" stroke="#b7f36b"/><text x="24" y="35" fill="#b7f36b" font-size="13" font-family="monospace">01</text>
      <text x="18" y="76" fill="#e8eee9" font-size="16" font-weight="700">Repository</text><text x="18" y="97" fill="#e8eee9" font-size="16" font-weight="700">intake</text>
      <text x="18" y="132" fill="#91a39a" font-size="11">HTTPS GitHub URL</text><text x="18" y="151" fill="#91a39a" font-size="11">Owner / repo validation</text>
      <rect x="18" y="180" width="140" height="27" rx="6" fill="#18221c"/><text x="28" y="197" fill="#b7f36b" font-size="10" font-family="monospace">github.com/org/app</text>
    </g>
    <g transform="translate(245 157)">
      <rect width="178" height="228" rx="13" fill="#111816" stroke="#344238"/><circle cx="28" cy="30" r="15" fill="#18211d" stroke="#78936e"/><text x="24" y="35" fill="#b7f36b" font-size="13" font-family="monospace">02</text>
      <text x="18" y="76" fill="#e8eee9" font-size="16" font-weight="700">Bounded</text><text x="18" y="97" fill="#e8eee9" font-size="16" font-weight="700">checkout</text>
      <text x="18" y="132" fill="#91a39a" font-size="11">Shallow clone only</text><text x="18" y="151" fill="#91a39a" font-size="11">Size + time limits</text>
      <rect x="18" y="180" width="140" height="27" rx="6" fill="#18221c"/><text x="28" y="197" fill="#b7f36b" font-size="10" font-family="monospace">no code execution</text>
    </g>
    <g transform="translate(456 157)">
      <rect width="178" height="228" rx="13" fill="#111816" stroke="#344238"/><circle cx="28" cy="30" r="15" fill="#18211d" stroke="#78936e"/><text x="24" y="35" fill="#b7f36b" font-size="13" font-family="monospace">03</text>
      <text x="18" y="76" fill="#e8eee9" font-size="16" font-weight="700">Scanner</text><text x="18" y="97" fill="#e8eee9" font-size="16" font-weight="700">evidence</text>
      <rect x="18" y="120" width="66" height="24" rx="5" fill="#19251d" stroke="#344b35"/><text x="30" y="136" fill="#aaca91" font-size="10" font-family="monospace">TRIVY</text>
      <rect x="91" y="120" width="70" height="24" rx="5" fill="#19251d" stroke="#344b35"/><text x="100" y="136" fill="#aaca91" font-size="9" font-family="monospace">SEMGREP</text>
      <text x="18" y="171" fill="#91a39a" font-size="11">Vulnerabilities</text><text x="18" y="190" fill="#91a39a" font-size="11">Secrets · SAST · config</text>
    </g>
    <g transform="translate(667 157)">
      <rect width="178" height="228" rx="13" fill="#111816" stroke="#344238"/><circle cx="28" cy="30" r="15" fill="#18211d" stroke="#78936e"/><text x="24" y="35" fill="#b7f36b" font-size="13" font-family="monospace">04</text>
      <text x="18" y="76" fill="#e8eee9" font-size="16" font-weight="700">Normalize</text><text x="18" y="97" fill="#e8eee9" font-size="16" font-weight="700">&amp; redact</text>
      <text x="18" y="132" fill="#91a39a" font-size="11">Shared finding model</text><text x="18" y="151" fill="#91a39a" font-size="11">Severity + provenance</text>
      <rect x="18" y="180" width="140" height="27" rx="6" fill="#18221c"/><text x="28" y="197" fill="#b7f36b" font-size="10" font-family="monospace">[REDACTED]</text>
    </g>
    <g transform="translate(878 157)">
      <rect width="178" height="228" rx="13" fill="#111816" stroke="#344238"/><circle cx="28" cy="30" r="15" fill="#18211d" stroke="#78936e"/><text x="24" y="35" fill="#b7f36b" font-size="13" font-family="monospace">05</text>
      <text x="18" y="76" fill="#e8eee9" font-size="16" font-weight="700">Optional AI</text><text x="18" y="97" fill="#e8eee9" font-size="16" font-weight="700">triage</text>
      <text x="18" y="132" fill="#91a39a" font-size="11">Google ADK + Gemini</text><text x="18" y="151" fill="#91a39a" font-size="11">Bounded read-only tools</text>
      <rect x="18" y="180" width="140" height="27" rx="6" fill="#18221c"/><text x="28" y="197" fill="#b7f36b" font-size="10" font-family="monospace">suggestions ≠ proof</text>
    </g>
    <g transform="translate(1089 157)">
      <rect width="157" height="228" rx="13" fill="#111816" stroke="#405338"/><circle cx="28" cy="30" r="15" fill="#1c291e" stroke="#b7f36b"/><text x="24" y="35" fill="#b7f36b" font-size="13" font-family="monospace">06</text>
      <text x="18" y="76" fill="#e8eee9" font-size="16" font-weight="700">Report &amp;</text><text x="18" y="97" fill="#e8eee9" font-size="16" font-weight="700">dashboard</text>
      <text x="18" y="132" fill="#91a39a" font-size="11">PostgreSQL JSONB</text><text x="18" y="151" fill="#91a39a" font-size="11">Filters + exports</text>
      <rect x="18" y="180" width="121" height="27" rx="6" fill="#18221c"/><text x="29" y="197" fill="#b7f36b" font-size="10" font-family="monospace">JSON · Markdown</text>
    </g>
  </g>
  <g stroke="#6f8b67" stroke-width="1.6" marker-end="url(#arrow)"><path d="M215 271h24"/><path d="M426 271h24"/><path d="M637 271h24"/><path d="M848 271h24"/><path d="M1059 271h24"/></g>
  <rect x="34" y="420" width="1212" height="49" rx="10" fill="#111816" stroke="#29372f"/>
  <circle cx="57" cy="444" r="5" fill="#b7f36b"/><text x="72" y="448" fill="#afbeb2" font-family="Arial,sans-serif" font-size="12">Scanner output remains the source of truth.</text>
  <text x="527" y="448" fill="#596b60" font-family="monospace" font-size="11">·</text>
  <text x="548" y="448" fill="#afbeb2" font-family="Arial,sans-serif" font-size="12">AI context is optional, bounded, and labeled.</text>
  <text x="1034" y="448" fill="#b7f36b" font-family="monospace" font-size="10">EVIDENCE → ACTION</text>
</svg>
