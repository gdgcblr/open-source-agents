services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: repolens-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-repolens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or environment}
      POSTGRES_DB: ${POSTGRES_DB:-repolens}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-repolens} -d ${POSTGRES_DB:-repolens}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # FastAPI Backend Service (Python 3.11 + Git + Trivy + Semgrep + Google ADK)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: repolens-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-repolens}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-repolens}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      MAX_REPO_SIZE_MB: ${MAX_REPO_SIZE_MB:-100}
      SCAN_TIMEOUT_SECONDS: ${SCAN_TIMEOUT_SECONDS:-300}
      MAX_SNIPPET_BYTES: ${MAX_SNIPPET_BYTES:-2048}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      db:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # React + Vite Frontend Dashboard Service (Nginx reverse proxy to backend)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: repolens-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
      - "3000:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
