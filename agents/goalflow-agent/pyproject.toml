[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "goalflow"
version = "0.1.0"
description = "A Personal Growth and Goal-Reflection AI Agent built with Google ADK and Gemini"
readme = "README.md"
authors = [{ name = "GoalFlow Contributors" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "google-adk",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
goalflow = "goalflow.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
