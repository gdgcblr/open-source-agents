# README Drafter + its own Ollama server.
#
#   PROJECT_DIR=/path/to/project docker compose up      -> http://localhost:8000
#
# macOS: Docker cannot use the Mac GPU, so the bundled Ollama runs on CPU.
# For speed, use Ollama installed on the Mac instead:
#   OLLAMA_API_BASE=http://host.docker.internal:11434 PROJECT_DIR=... docker compose up --no-deps readme-drafter

services:
  ollama:
    image: ollama/ollama:0.40.10
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Downloads the model on first run; skipped when it is already present.
  model-pull:
    image: ollama/ollama:0.40.10
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint:
      - sh
      - -c
      - ollama show ${MODEL_NAME:-gemma4:e4b} > /dev/null 2>&1 || ollama pull ${MODEL_NAME:-gemma4:e4b}

  readme-drafter:
    build: .
    depends_on:
      model-pull:
        condition: service_completed_successfully
    environment:
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://ollama:11434}
      MODEL_NAME: ${MODEL_NAME:-gemma4:e4b}
      NUM_CTX: ${NUM_CTX:-32768}
      PROJECT_NAME: ${PROJECT_NAME:-}
    volumes:
      - ${PROJECT_DIR:?Set PROJECT_DIR to the folder you want a README for}:/workspace:ro
      - ./output:/output
    ports:
      - "8000:8000"

volumes:
  ollama-models:
