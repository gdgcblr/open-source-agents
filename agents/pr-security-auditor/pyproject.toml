[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-security-auditor"
version = "0.1.0"
description = "Audit Git changes for likely secrets, risky code patterns, and vulnerable exact dependencies."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
pr-security-auditor = "pr_security_auditor:main"

[tool.setuptools]
py-modules = ["pr_security_auditor"]
package-dir = {"" = "src"}
