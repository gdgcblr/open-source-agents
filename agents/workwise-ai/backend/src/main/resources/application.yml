spring:
  application:
    name: workwise-ai-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:workwise}
    username: ${DB_USER:workwise}
    password: ${DB_PASSWORD:workwise}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

workwise:
  ai:
    provider: ${WORKWISE_AI_PROVIDER:mock}
    llm:
      api-url: ${WORKWISE_LLM_API_URL:}
      api-key: ${WORKWISE_LLM_API_KEY:}
      model: ${WORKWISE_LLM_MODEL:}
      timeout-ms: ${WORKWISE_LLM_TIMEOUT_MS:15000}
  relevance:
    weights:
      job-industry: 0.30
      economic: 0.25
      actionability: 0.20
      location: 0.10
      recency: 0.10
      goal-alignment: 0.05
    threshold: 40
  demo:
    default-user-id: demo-textile-trader

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
