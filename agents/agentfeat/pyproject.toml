[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentfeat"
version = "0.1.0"
description = "AI-powered feature development agent: from feature request to working code, with AI."
readme = "README.md"
authors = [{ name = "Purushotham Kurchavati" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "google-genai>=1.47.0",
    "pydantic>=2.10.0",
    "rich>=13.9.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
agentfeat = "agentfeat.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
