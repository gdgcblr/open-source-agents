<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PR Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1EC; --panel:#F8FAF7; --ink:#1C2421; --muted:#5E6B66; --line:#CBD3CD;
  --spruce:#1F5C4A; --spruce-ink:#F2F7F4; --amber:#B4761B; --brick:#A83A2F; --grid:#DCE2DD;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#141917; --panel:#1B211F; --ink:#E3E8E4; --muted:#93A19B; --line:#2E3733;
  --spruce:#5FB394; --spruce-ink:#0E1A15; --amber:#E0A44A; --brick:#E07063; --grid:#252D2A;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "Schibsted Grotesk",system-ui,sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--spruce);outline-offset:2px}
header{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline;padding:14px 20px;border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0;font-weight:700}
header .meta{color:var(--muted);font-size:13px}
header .repos{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--muted)}
.dot.monitoring{background:var(--spruce)} .dot.error{background:var(--brick)}
header .spacer{flex:1}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:4px 12px}
main{display:grid;grid-template-columns:minmax(280px,380px) 1fr;min-height:calc(100vh - 56px)}
#list{border-right:1px solid var(--line);overflow:auto;max-height:calc(100vh - 56px)}
.row{display:grid;grid-template-columns:40px 1fr;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:3px solid transparent;width:100%;text-align:left;color:inherit;border-top:0;border-right:0}
.row:hover{background:var(--panel)} .row[aria-current=true]{background:var(--panel);border-left-color:var(--spruce)}
.row .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .s{color:var(--muted);font-size:13px}
.empty{padding:32px 20px;color:var(--muted)}
#detail{padding:24px 28px;overflow:auto;max-height:calc(100vh - 56px)}
.ref{color:var(--muted);font-size:14px} .ref a{color:inherit}
h2{font-size:26px;line-height:1.2;margin:4px 0 16px;max-width:40ch;font-weight:700}
h3{font-size:15px;margin:28px 0 8px}
.verdict{display:grid;grid-template-columns:220px 1fr;gap:28px;align-items:start}
.verdict svg{width:220px;height:220px;display:block}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-weight:500}
.risk-high{color:var(--brick)} .risk-medium{color:var(--amber)} .risk-low{color:var(--spruce)}
.summary{max-width:68ch;margin:14px 0 0}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.primary{background:var(--spruce);color:var(--spruce-ink);border:0;border-radius:6px;padding:8px 18px;font-weight:700}
.primary:disabled,.ghost:disabled{opacity:.45;cursor:not-allowed}
.findings{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:4px 28px}
.findings ul{margin:0;padding-left:18px;max-width:60ch} .findings li{margin:4px 0}
.findings .none{color:var(--muted);list-style:none;margin-left:-18px}
.log{font:12.5px/1.6 "JetBrains Mono",ui-monospace,monospace;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;max-height:280px;overflow:auto;white-space:pre-wrap}
.log .warn{color:var(--amber)} .log .error{color:var(--brick)} .log time{color:var(--muted)}
table{border-collapse:collapse;width:100%;max-width:820px;font-size:14px}
td,th{text-align:left;padding:6px 10px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500}
.pass{color:var(--spruce)} .fail{color:var(--brick)}
details{margin-top:6px} summary{cursor:pointer;color:var(--muted)}
pre.diff{font:12px/1.5 "JetBrains Mono",monospace;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;overflow:auto;max-height:420px}
.add{color:var(--spruce)} .del{color:var(--brick)}
.banner{border:1px solid var(--line);border-left:3px solid var(--amber);padding:10px 14px;border-radius:6px;max-width:820px;margin-top:12px}
.toast{position:fixed;bottom:16px;right:16px;background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:6px;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
@media (max-width:800px){main{grid-template-columns:1fr}#list{max-height:40vh;border-right:0;border-bottom:1px solid var(--line)}#detail{padding:20px 16px;max-height:none}.verdict{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>PR Agent</h1>
  <div class="repos" id="repos"></div>
  <span class="spacer"></span>
  <span class="meta" id="meta"></span>
  <button class="ghost" id="pollBtn">Check now</button>
</header>
<main>
  <nav id="list" aria-label="Pull requests"></nav>
  <section id="detail"><p class="empty">Pick a pull request to see its evaluation.</p></section>
</main>
<div class="toast" id="toast" role="status"></div>
<script>
const $ = s => document.querySelector(s);
let state = {prs: []}, selected = null, detail = null;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STATUS = {new:"New", queued:"Waiting to be evaluated", evaluating:"Evaluating", evaluated:"Waiting for your decision",
  approved:"Approved, waiting to start", implementing:"Implementing", done:"Implemented locally", failed:"Implementation needs attention",
  rejected:"Skipped", filtered:"Filtered out", stale:"Changed after approval", error:"Evaluation failed", interrupted:"Interrupted by restart"};
const REC = {implement:"Implement", needs_review:"Needs a closer look", skip:"Skip"};

async function api(path, opts={}) {
  const r = await fetch(path, {...opts, headers: {"X-PR-Agent":"1"}});
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || r.statusText);
  return body;
}
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2600); }

// Value × quality plot: the PR as a point, the others as faint dots.
function plot(pr, all, size=220) {
  const pad = 26, w = size - pad - 6, X = v => pad + (v/10)*w, Y = v => 6 + w - (v/10)*w;
  const color = r => r==="high" ? "var(--brick)" : r==="medium" ? "var(--amber)" : "var(--spruce)";
  const others = all.filter(p => p.id!==pr.id && p.value_score!=null)
    .map(p => `<circle cx="${X(p.value_score)}" cy="${Y(p.quality_score)}" r="3" fill="var(--muted)" opacity=".35"/>`).join("");
  const me = pr.value_score==null ? "" :
    `<circle cx="${X(pr.value_score)}" cy="${Y(pr.quality_score)}" r="8" fill="${color(pr.risk)}"/>`;
  return `<svg viewBox="0 0 ${size} ${size}" role="img" aria-label="Value ${pr.value_score ?? "?"} of 10, quality ${pr.quality_score ?? "?"} of 10">
    <rect x="${pad}" y="6" width="${w}" height="${w}" fill="var(--panel)" stroke="var(--line)"/>
    <line x1="${X(5)}" y1="6" x2="${X(5)}" y2="${6+w}" stroke="var(--grid)"/><line x1="${pad}" y1="${Y(5)}" x2="${pad+w}" y2="${Y(5)}" stroke="var(--grid)"/>
    <text x="${pad+w-4}" y="20" text-anchor="end" font-size="11" fill="var(--muted)">worth building</text>
    <text x="${pad+4}" y="${w}" font-size="11" fill="var(--muted)">not worth it</text>
    ${others}${me}
    <text x="${pad+w/2}" y="${size-2}" text-anchor="middle" font-size="11" fill="var(--muted)">Feature value</text>
    <text transform="translate(11 ${6+w/2}) rotate(-90)" text-anchor="middle" font-size="11" fill="var(--muted)">Code quality</text></svg>`;
}
function mini(p){
  if (p.value_score==null) return `<svg width="40" height="40" aria-hidden="true"><rect x=".5" y=".5" width="39" height="39" fill="none" stroke="var(--line)" stroke-dasharray="3 3"/></svg>`;
  const c = p.risk==="high"?"var(--brick)":p.risk==="medium"?"var(--amber)":"var(--spruce)";
  return `<svg width="40" height="40" aria-hidden="true"><rect x=".5" y=".5" width="39" height="39" fill="none" stroke="var(--line)"/>
    <circle cx="${4+p.value_score*3.2}" cy="${36-p.quality_score*3.2}" r="4" fill="${c}"/></svg>`;
}

function renderList() {
  const repos = state.repos || [];
  $("#repos").innerHTML = repos.map(r => `<span title="${esc(r.last_error||"")}"><span class="dot ${esc(r.status)}"></span>${esc(r.full_name)}</span>`).join("")
    || `<span class="meta">No repositories configured</span>`;
  const busy = state.busy ? ` · Working on #${state.busy.number} (${state.busy.kind})` : "";
  $("#meta").textContent = `${state.model}${state.strict_local ? ", local only" : ""}${busy}`;
  if (!state.prs.length) { $("#list").innerHTML = `<p class="empty">No open pull requests yet. The agent checks every ${state.poll_interval}s.</p>`; return; }
  $("#list").innerHTML = state.prs.map(p => `<button class="row" data-id="${p.id}" aria-current="${p.id===selected}">
      ${mini(p)}<span><span class="t">${esc(p.title)}</span>
      <span class="s">${esc(p.repo)} #${p.number} · ${esc(STATUS[p.status]||p.status)}${p.recommendation ? " · "+esc(REC[p.recommendation]) : ""}</span></span></button>`).join("");
}

function list(items){ return items && items.length ? items.map(i=>`<li>${esc(i)}</li>`).join("") : `<li class="none">Nothing found</li>`; }
function diffHtml(d){ return esc(d).split("\n").map(l => l.startsWith("+")&&!l.startsWith("+++") ? `<span class="add">${l}</span>` : l.startsWith("-")&&!l.startsWith("---") ? `<span class="del">${l}</span>` : l).join("\n"); }

function renderDetail() {
  if (!detail) return;
  const {pr, runs, events} = detail, ev = pr.evaluation || {};
  const impl = runs.find(r => r.kind==="implement");
  const rep = impl && impl.report;
  const canApprove = ["evaluated","failed","interrupted","stale"].includes(pr.status) && pr.evaluated_sha===pr.head_sha;
  const canReject = !["rejected","implementing"].includes(pr.status);
  const OUT = {passed:"All checks passed", unverified:"Changed, but no checks were found to verify it", checks_failing:"Checks still failing", no_changes:"No changes were made"};
  $("#detail").innerHTML = `
    <div class="ref">${esc(pr.repo)} #${pr.number} by ${esc(pr.author)} · <a href="${esc(pr.url)}" target="_blank" rel="noopener">Open on GitHub</a> · ${esc((pr.head_sha||"").slice(0,7))}</div>
    <h2>${esc(pr.title)}</h2>
    <div class="verdict">${plot(pr, state.prs)}
      <div><dl class="facts">
        <dt>Status</dt><dd>${esc(STATUS[pr.status]||pr.status)}</dd>
        <dt>Recommendation</dt><dd>${esc(REC[pr.recommendation]||"Not evaluated yet")}</dd>
        <dt>Category</dt><dd>${esc(pr.category||"–")}</dd>
        <dt>Value</dt><dd>${pr.value_score ?? "–"} / 10</dd>
        <dt>Quality</dt><dd>${pr.quality_score ?? "–"} / 10</dd>
        <dt>Risk</dt><dd class="risk-${esc(pr.risk)}">${esc(pr.risk||"–")}</dd></dl>
        ${ev.summary ? `<p class="summary">${esc(ev.summary)}</p>` : ""}
        <div class="actions">
          <button class="primary" data-act="approve" ${canApprove?"":"disabled"}>Implement locally</button>
          <button class="ghost" data-act="reject" ${canReject?"":"disabled"}>Skip</button>
          <button class="ghost" data-act="reevaluate">Re-evaluate</button>
        </div></div></div>
    ${pr.status==="stale" ? `<div class="banner">This PR got new commits after you approved it, so nothing was implemented. Re-evaluate it, then decide again.</div>` : ""}
    ${pr.evaluation ? `<h3>Findings</h3><div class="findings">
      <div><h3>Why it's useful</h3><ul>${list(ev.value_findings)}</ul></div>
      <div><h3>Code quality</h3><ul>${list(ev.quality_findings)}</ul></div>
      <div><h3>Security</h3><ul>${list(ev.security_findings)}</ul></div>
      <div><h3>Risks</h3><ul>${list(ev.risks)}</ul></div></div>` : ""}
    ${rep ? `<h3>Implementation result: ${esc(OUT[rep.outcome]||rep.outcome)}</h3>
      <p class="ref">Workspace: ${esc(rep.workspace)}<br>${esc(rep.note)} Repair attempts: ${rep.repair_attempts}.</p>
      ${rep.remaining_issues.length ? `<div class="banner"><strong>Remaining issues</strong><ul>${list(rep.remaining_issues)}</ul></div>` : ""}
      <h3>Checks</h3>${rep.checks.length ? `<table><tr><th>Command</th><th>Result</th></tr>${rep.checks.map(c=>`<tr><td>${esc(c.command)}<details><summary>Output</summary><pre class="diff">${esc(c.output)}</pre></details></td><td class="${c.exit_code===0?"pass":"fail"}">${c.exit_code===0?"Passed":"Failed (exit "+c.exit_code+")"}</td></tr>`).join("")}</table>` : `<p class="ref">No checks ran.</p>`}
      <h3>Changed files</h3>${rep.changed_files.length ? `<table>${rep.changed_files.map(f=>`<tr><td>${esc(f.path)}</td><td>${esc(f.status)}</td></tr>`).join("")}</table>` : `<p class="ref">None.</p>`}
      <details><summary>Show diff</summary><pre class="diff">${diffHtml(rep.diff)}</pre></details>
      <details><summary>Show plan</summary><pre class="diff">${esc(rep.plan)}</pre></details>` : (impl && impl.error ? `<div class="banner">${esc(impl.error.split("\n")[0])}</div>` : "")}
    <h3>Activity</h3>
    <div class="log">${events.map(e=>`<div class="${esc(e.level)}"><time>${esc(e.ts.slice(11,19))}</time> ${esc(e.message)}</div>`).join("") || "No activity yet."}</div>
    <h3>History</h3>
    <table><tr><th>Run</th><th>Revision</th><th>Status</th><th>Finished</th></tr>
    ${runs.map(r=>`<tr><td>${esc(r.kind)}</td><td>${esc((r.sha||"").slice(0,7))}</td><td>${esc(r.status)}</td><td>${esc((r.finished_at||"").replace("T"," ").slice(0,19))}</td></tr>`).join("")}</table>`;
}

async function refresh() {
  try { state = await api("/api/state"); renderList();
    if (selected) { detail = await api(`/api/prs/${selected}`); renderDetail(); }
  } catch(e) { $("#meta").textContent = "Dashboard can't reach the agent: " + e.message; }
}
$("#list").addEventListener("click", e => { const b = e.target.closest(".row"); if (!b) return; selected = +b.dataset.id; refresh(); });
$("#detail").addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b || !selected) return;
  const act = b.dataset.act;
  if (act==="approve" && !confirm("Implement this PR in an isolated local workspace? Nothing will be pushed.")) return;
  try { await api(`/api/prs/${selected}/${act}`, {method:"POST"});
    toast({approve:"Approved. Implementation queued.", reject:"Skipped.", reevaluate:"Re-evaluation queued."}[act]); refresh();
  } catch(err) { toast(err.message); }
});
$("#pollBtn").addEventListener("click", async () => { await api("/api/poll",{method:"POST"}); toast("Checking GitHub now."); setTimeout(refresh, 3000); });
refresh(); setInterval(refresh, 4000);
</script>
</body>
</html>
