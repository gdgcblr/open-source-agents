name: Maintainer Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: agents/maintainer-guard
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Maintainer Guard
        id: guard
        working-directory: agents/maintainer-guard
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL_PROVIDER: gemini
          MODEL_NAME: gemini-2.5-flash
        run: |
          python main.py --repo-root ../.. --base origin/${{ github.event.pull_request.base.ref }} --json > guard-report.json || true

      - name: Post PR comment with review result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'agents/maintainer-guard/guard-report.json';
            let body = '### Maintainer Guard\n\nNo review output was generated.';
            if (fs.existsSync(path)) {
              const data = JSON.parse(fs.readFileSync(path, 'utf8'));
              body = `### Maintainer Guard\n\n**Verdict:** ${data.verdict || 'UNKNOWN'}\n\n**Summary:** ${data.summary || 'No summary available.'}\n\n**Security Issues:**\n${(data.security_violations || []).map(x => `- ${x}`).join('\n') || '- None'}\n\n**Policy Issues:**\n${(data.policy_violations || []).map(x => `- ${x}`).join('\n') || '- None'}\n\n**Actionable Remediation:**\n${(data.actionable_remediation || []).map(x => `- ${x}`).join('\n') || '- None'}`;
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Fail if blocked by guardrails
        if: failure()
        run: |
          echo "Maintainer Guard detected a blocking issue."
          exit 1
